name: Checks

# Runs on pull requests. Builds the site from the tracked payload, scans the tool for duplicate
# function names (a later copy silently wins), and checks the feeds parse. A second job runs the R tests
# (tests/run_tests.R). Deploys nothing.
on:
  pull_request:
    paths:
      - "R/**"
      - "tool/**"
      - "app/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Duplicate function scan
        run: python3 app/check_dupes.py
      - name: Build site from tracked payload
        run: sh app/build_pages.sh "$RUNNER_TEMP/site"
      - name: Feeds are well formed
        run: |
          python3 - "$RUNNER_TEMP/site/matchmaker/feeds" <<'EOF'
          import sys, glob, xml.dom.minidom as m
          d = sys.argv[1]; f = glob.glob(d + "/*.atom")
          assert f, "no feeds built"
          for p in f: m.parse(p)
          for p in glob.glob(d + "/*.ics"):
              t = open(p).read(); assert t.startswith("BEGIN:VCALENDAR") and t.rstrip().endswith("END:VCALENDAR"), p
          print("ok:", len(f), "agency feeds")
          r = glob.glob(d + "/research/*.atom")
          assert r, "no researcher feeds built"
          for p in r: m.parse(p)
          for p in glob.glob(d + "/research/*.ics"):
              t = open(p).read(); assert t.startswith("BEGIN:VCALENDAR") and t.rstrip().endswith("END:VCALENDAR"), p
          print("ok:", len(r), "researcher feeds")
          EOF
      - name: Researcher feed tests
        run: python3 -m unittest tests/research/test_feeds.py
      - name: Researcher tab unit tests
        run: node tests/research/test_core.js
      - name: Researcher tab test set report
        run: node tests/research/run_testset.js

  r-tests:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      # Same list as pages.yml (enough for the daily job) plus V8, which only tests/agreement.R needs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::here
            any::httr2
            any::janitor
            any::jsonlite
            any::Matrix
            any::digest
            any::purrr
            any::readr
            any::stringr
            any::tibble
            any::V8
      # items.csv is generated and gitignored; without it the tests would fall back to the toy example data.
      # The ranking step rebuilds it from tracked inputs, pinned to the snapshot date the tests expect.
      - name: Build items.csv from tracked inputs
        run: AS_OF_DATE=2026-11-07 Rscript R/10_run_ranking.R
      - name: R tests
        run: Rscript tests/run_tests.R
